<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkUp</title>
<meta name="description" content="Log workouts on your phone and get suggestions for what to train next.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorkUp">
<meta name="theme-color" content="#111317">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface2: #eceef2; --text: #14161a; --muted: #636a75;
  --border: #d9dde3; --accent: #2f7d32; --accent-soft: #dcefd9; --accent-text: #ffffff;
  --warn: #b85c00; --warn-soft: #fde9d4; --danger: #c62828;
  --region: #e3e6eb; --region-stroke: #9aa1ab; --region-recent: #c9d8c5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1b1e24; --surface2: #262a32; --text: #f1f3f5; --muted: #9ba3ae;
    --border: #323741; --accent: #7bd36f; --accent-soft: #24371f; --accent-text: #0d1a0b;
    --warn: #ffb066; --warn-soft: #3a2a18; --danger: #ff6b6b;
    --region: #2b3039; --region-stroke: #59616d; --region-recent: #34472f;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1b1e24; --surface2: #262a32; --text: #f1f3f5; --muted: #9ba3ae;
  --border: #323741; --accent: #7bd36f; --accent-soft: #24371f; --accent-text: #0d1a0b;
  --warn: #ffb066; --warn-soft: #3a2a18; --danger: #ff6b6b;
  --region: #2b3039; --region-stroke: #59616d; --region-recent: #34472f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 96px);
  min-height: 100vh;
}
main { max-width: 520px; margin: 0 auto; padding: 12px 16px; }
h1 { font-size: 26px; margin: 8px 0 2px; letter-spacing: -0.02em; }
h2 { font-size: 18px; margin: 0 0 8px; }
.sub { color: var(--muted); margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin: 12px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .card { margin: 0; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
.big { font-size: 34px; font-weight: 700; line-height: 1.1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px;
  border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn.big { min-height: 60px; font-size: 20px; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.chip { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--surface2); font-size: 14px; margin: 2px 4px 2px 0; }
.chip.accent { background: var(--accent-soft); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 20px; }
/* body picker */
.bodywrap { position: relative; display: flex; justify-content: center; }
.bodywrap svg { width: 230px; max-width: 70vw; height: auto; touch-action: manipulation; }
.region { fill: var(--region); stroke: var(--region-stroke); stroke-width: 1.5; cursor: pointer; transition: fill .15s; }
.region.recent { fill: var(--region-recent); }
.region.suggested { fill: var(--accent); }
.region:active { fill: var(--accent-soft); }
.inert { fill: var(--surface2); stroke: var(--region-stroke); stroke-width: 1.5; }
.rlabel { font-size: 11px; font-weight: 700; fill: var(--text); pointer-events: none; text-anchor: middle; }
.rlabel.on { fill: var(--accent-text); }
.flip { position: absolute; right: 0; bottom: 8px; }
.week { display: flex; justify-content: space-between; margin: 6px 0 2px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--region-stroke); }
.dot.on { background: var(--accent); border-color: var(--accent); }
.dot.today { outline: 2px solid var(--text); outline-offset: 2px; }
.warnbox { background: var(--warn-soft); border-color: transparent; }
.warnbox .big { color: var(--warn); }
.progress { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.progress > div { height: 100%; background: var(--accent); }
/* workout */
.entry h3 { margin: 0; font-size: 18px; }
.sets { margin: 8px 0; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 6px; align-items: center; }
.stepper button { height: 56px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); font-size: 26px; font-weight: 700; }
.stepper input { height: 56px; width: 100%; text-align: center; font-size: 26px; font-weight: 700; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.field { margin-bottom: 8px; }
.field .label { text-align: center; }
.restbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
  background: var(--surface); border-top: 1px solid var(--border); z-index: 10; }
.restbar .inner { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.restbar .time { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; flex: 1; }
.list button.item { display: flex; width: 100%; justify-content: space-between; align-items: center; text-align: left;
  padding: 14px; min-height: 52px; border: 0; border-bottom: 1px solid var(--border); background: transparent; }
.list button.item:last-child { border-bottom: 0; }
.tabs { display: flex; gap: 6px; margin: 8px 0; }
.tabs button { flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
.tabs button.on { background: var(--text); color: var(--bg); }
input[type=text], select { width: 100%; min-height: 48px; padding: 0 12px; font: inherit; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check input { width: 22px; height: 22px; }
.toggle { flex: 1; min-height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); font-weight: 600; }
.toggle.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.hist .when { font-weight: 700; }
.empty { text-align: center; padding: 24px 8px; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<div id="rest"></div>
<script>
(function () {
'use strict';

var KEY = 'workup.v1';
var COLLECT = 14;   // workouts logged before suggestions start
var HABITS = 40;    // workouts before habit-based suggestions
var GROUPS = [
  ['chest', 'Chest'], ['back', 'Back'], ['biceps', 'Biceps'], ['triceps', 'Triceps'], ['abs', 'Abs'],
  ['quads', 'Quads'], ['glutes', 'Glutes'], ['hamstrings', 'Hamstrings'], ['cardio', 'Cardio']
];
var GN = {}; GROUPS.forEach(function (g) { GN[g[0]] = g[1]; });
var CATS = { machine: 'Machines', free: 'Free weights', floor: 'Floor', cardio: 'Cardio' };
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// [name, category, kind, groups]; kind: strength (reps x weight), timed (seconds), cardio (minutes + distance)
var SEED = [
  ['Chest press machine', 'machine', 'strength', ['chest', 'triceps']],
  ['Pec deck', 'machine', 'strength', ['chest']],
  ['Dumbbell bench press', 'free', 'strength', ['chest', 'triceps']],
  ['Incline dumbbell press', 'free', 'strength', ['chest']],
  ['Push-ups', 'floor', 'strength', ['chest', 'triceps']],
  ['Lat pulldown', 'machine', 'strength', ['back', 'biceps']],
  ['Seated cable row', 'machine', 'strength', ['back', 'biceps']],
  ['Dumbbell row', 'free', 'strength', ['back']],
  ['Deadlift', 'free', 'strength', ['back', 'hamstrings', 'glutes']],
  ['Dumbbell curl', 'free', 'strength', ['biceps']],
  ['Hammer curl', 'free', 'strength', ['biceps']],
  ['Kettlebell curl', 'free', 'strength', ['biceps']],
  ['Cable curl', 'machine', 'strength', ['biceps']],
  ['Tricep pushdown', 'machine', 'strength', ['triceps']],
  ['Overhead dumbbell extension', 'free', 'strength', ['triceps']],
  ['Bench dips', 'floor', 'strength', ['triceps']],
  ['Crunches', 'floor', 'strength', ['abs']],
  ['Plank', 'floor', 'timed', ['abs']],
  ['Hanging leg raises', 'floor', 'strength', ['abs']],
  ['Ab crunch machine', 'machine', 'strength', ['abs']],
  ['Kettlebell Russian twist', 'free', 'strength', ['abs']],
  ['Leg press', 'machine', 'strength', ['quads', 'glutes']],
  ['Leg extension', 'machine', 'strength', ['quads']],
  ['Kettlebell goblet squat', 'free', 'strength', ['quads', 'glutes']],
  ['Dumbbell lunges', 'free', 'strength', ['quads', 'glutes']],
  ['Hip thrust', 'free', 'strength', ['glutes']],
  ['Glute kickback machine', 'machine', 'strength', ['glutes']],
  ['Kettlebell swing', 'free', 'strength', ['glutes', 'hamstrings']],
  ['Romanian deadlift', 'free', 'strength', ['hamstrings', 'glutes']],
  ['Leg curl', 'machine', 'strength', ['hamstrings']],
  ['Treadmill', 'cardio', 'cardio', ['cardio']],
  ['StairMaster', 'cardio', 'cardio', ['cardio']],
  ['Bike', 'cardio', 'cardio', ['cardio']],
  ['Rowing machine', 'cardio', 'cardio', ['cardio']],
  ['Elliptical', 'cardio', 'cardio', ['cardio']],
  ['Outdoor run', 'cardio', 'cardio', ['cardio']]
];

// ---------- storage ----------
var S;
function fresh() {
  return {
    exercises: SEED.map(function (e, i) { return { id: 'e' + i, name: e[0], category: e[1], kind: e[2], groups: e[3] }; }),
    workouts: [], active: null, skips: {}, unit: 'lb', lastSuggest: null
  };
}
function load() {
  try { var raw = localStorage.getItem(KEY); if (raw) { var d = JSON.parse(raw); if (d && d.exercises) return d; } } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
S = load();
S.skips = S.skips || {};

var view = S.active ? 'workout' : 'home';
var showBack = false;
var pickTab = 'today';
var armed = null; // two-tap confirmations

// ---------- helpers ----------
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function midnight(d) { d = new Date(d); d.setHours(0, 0, 0, 0); return d; }
function daysBetween(a, b) { return Math.round((midnight(b) - midnight(a)) / 86400000); }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
function ex(id) { for (var i = 0; i < S.exercises.length; i++) if (S.exercises[i].id === id) return S.exercises[i]; return null; }
function groupsOf(w) {
  var set = {};
  (w.groups || []).forEach(function (g) { set[g] = 1; });
  (w.entries || []).forEach(function (en) { if (!en.sets.length) return; var e = ex(en.exerciseId); if (e) e.groups.forEach(function (g) { set[g] = 1; }); });
  return set;
}
function sorted() { return S.workouts.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }); }
function lastFor(group) {
  var ws = sorted();
  for (var i = ws.length - 1; i >= 0; i--) if (groupsOf(ws[i])[group]) return ws[i].date;
  return null;
}
function daysSinceCardio() {
  if (!S.workouts.length) return null;
  var last = lastFor('cardio');
  return last ? daysBetween(last, new Date()) : daysBetween(sorted()[0].date, new Date());
}
function step() { return S.unit === 'kg' ? 2.5 : 5; }
function fmtSet(kind, s) {
  if (kind === 'timed') return s.seconds + 's';
  if (kind === 'cardio') return s.minutes + ' min' + (s.distance ? ' · ' + s.distance + ' mi' : '');
  return s.reps + ' × ' + (s.weight ? s.weight + ' ' + S.unit : 'bodyweight');
}
function lastSetsFor(exerciseId) {
  var ws = sorted();
  for (var i = ws.length - 1; i >= 0; i--) {
    var en = (ws[i].entries || []).filter(function (x) { return x.exerciseId === exerciseId && x.sets.length; });
    if (en.length) return en[0].sets;
  }
  return null;
}
function usage(exerciseId) {
  var n = 0, last = null;
  S.workouts.forEach(function (w) {
    (w.entries || []).forEach(function (en) {
      if (en.exerciseId === exerciseId && en.sets.length) { n++; if (!last || w.date > last) last = w.date; }
    });
  });
  return { n: n, last: last };
}

// ---------- suggestions ----------
function pickExercises(group, k) {
  var cands = S.exercises.filter(function (e) { return e.groups.indexOf(group) >= 0; })
    .map(function (e) { return { e: e, u: usage(e.id) }; });
  var used = cands.filter(function (c) { return c.u.n > 0; }).sort(function (a, b) { return b.u.n - a.u.n; });
  var unused = cands.filter(function (c) { return c.u.n === 0; });
  var picks = used.slice(0, k - 1);
  // rotate in the one you haven't done in the longest time (or never)
  var rest = used.slice(k - 1).sort(function (a, b) { return a.u.last < b.u.last ? -1 : 1; });
  var fresh = rest[0] || unused[0];
  if (fresh) picks.push(fresh);
  for (var i = 0; picks.length < k && i < unused.length; i++) if (picks.indexOf(unused[i]) < 0) picks.push(unused[i]);
  return picks.map(function (c) { return c.e; });
}

function suggest() {
  var ws = sorted(), n = ws.length;
  if (n < COLLECT) return null;
  var today = new Date(), dow = today.getDay();
  var onDow = ws.filter(function (w) { return new Date(w.date).getDay() === dow; });
  var scored = GROUPS.filter(function (g) { return g[0] !== 'cardio'; }).map(function (g) {
    var id = g[0];
    var dates = ws.filter(function (w) { return groupsOf(w)[id]; }).map(function (w) { return w.date; });
    var since = dates.length ? daysBetween(dates[dates.length - 1], today) : 30;
    var gap = 7;
    if (dates.length >= 2) gap = Math.max(2, daysBetween(dates[0], dates[dates.length - 1]) / (dates.length - 1));
    var score = since === 0 ? -1 : since / gap;
    var reason = dates.length ? 'last trained ' + plural(since, 'day') + ' ago' : 'not trained yet';
    if (n >= HABITS) {
      if (onDow.length >= 3) {
        var share = onDow.filter(function (w) { return groupsOf(w)[id]; }).length / onDow.length;
        score *= 0.6 + share;
        if (share >= 0.5) reason += ', and you usually train it on ' + DAYS[dow] + 's';
      }
      score *= Math.pow(0.85, Math.min(S.skips[id] || 0, 5));
    }
    return { id: id, score: score, since: since, reason: reason };
  }).sort(function (a, b) { return b.score - a.score; });

  var top = scored[0];
  var groups = [top.id];
  if (n >= HABITS) {
    var withTop = ws.filter(function (w) { return groupsOf(w)[top.id]; });
    var best = null, bestRatio = 0.4;
    scored.slice(1).forEach(function (s) {
      if (s.since < 1 || !withTop.length) return;
      var r = withTop.filter(function (w) { return groupsOf(w)[s.id]; }).length / withTop.length;
      if (r >= bestRatio) { bestRatio = r; best = s.id; }
    });
    if (best) groups.push(best);
  }
  var exercises = [];
  groups.forEach(function (g) { exercises = exercises.concat(pickExercises(g, groups.length > 1 ? 2 : 4)); });
  var dsc = daysSinceCardio();
  var reasons = [GN[top.id] + ': ' + top.reason];
  if (groups[1]) reasons.push('You usually pair it with ' + GN[groups[1]]);
  var cardio = dsc !== null && dsc >= 1;
  if (cardio) {
    reasons.push('Cardio: ' + plural(dsc, 'day') + ' without it');
    groups.push('cardio');
    exercises = exercises.concat(pickExercises('cardio', 1));
  }
  return { groups: groups, exercises: exercises, reasons: reasons };
}

// ---------- workout actions ----------
function startWorkout(groups, exerciseIds) {
  var sug = suggest();
  if (sug && !S.active) {
    var main = sug.groups[0];
    if (groups.indexOf(main) >= 0) S.skips[main] = 0; else S.skips[main] = (S.skips[main] || 0) + 1;
  }
  if (!S.active) S.active = { id: uid(), date: new Date().toISOString(), groups: [], entries: [], stretch: false, sauna: false, restUntil: 0 };
  groups.forEach(function (g) { if (S.active.groups.indexOf(g) < 0) S.active.groups.push(g); });
  (exerciseIds || []).forEach(addEntry);
  save(); go('workout');
}
function addEntry(exerciseId) {
  if (S.active.entries.some(function (en) { return en.exerciseId === exerciseId; })) return;
  S.active.entries.push({ exerciseId: exerciseId, sets: [], draft: null });
}
function draftFor(en) {
  if (en.draft) return en.draft;
  var e = ex(en.exerciseId), prev = en.sets[en.sets.length - 1];
  if (!prev) { var last = lastSetsFor(en.exerciseId); if (last) prev = last[Math.min(en.sets.length, last.length - 1)]; }
  if (prev) return JSON.parse(JSON.stringify(prev));
  if (e.kind === 'timed') return { seconds: 30 };
  if (e.kind === 'cardio') return { minutes: 20, distance: 0 };
  return { reps: 10, weight: 0 };
}
function finishWorkout() {
  var w = S.active;
  w.entries = w.entries.filter(function (en) { return en.sets.length; }).map(function (en) { return { exerciseId: en.exerciseId, sets: en.sets }; });
  w.end = new Date().toISOString();
  delete w.restUntil;
  S.workouts.push(w);
  S.active = null;
  save(); releaseWake(); go('home');
}

// ---------- wake lock ----------
var wake = null;
function holdWake() {
  try { if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function (l) { wake = l; l.addEventListener('release', function () { wake = null; }); }).catch(function () {}); } catch (e) {}
}
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && view === 'workout') holdWake(); });

// ---------- views ----------
var app = document.getElementById('app');
function go(v) { view = v; armed = null; render(); window.scrollTo(0, 0); }

function bodySVG(sug) {
  var recent = {};
  GROUPS.forEach(function (g) { var l = lastFor(g[0]); if (l && daysBetween(l, new Date()) <= 1) recent[g[0]] = 1; });
  var on = {}; if (sug) sug.groups.forEach(function (g) { on[g] = 1; });
  function r(group, shape, lx, ly, label) {
    var cls = 'region' + (on[group] ? ' suggested' : recent[group] ? ' recent' : '');
    return shape.replace('/>', ' class="' + cls + '" data-act="group" data-g="' + group + '" role="button" aria-label="' + GN[group] + '"/>') +
      (label ? '<text class="rlabel' + (on[group] ? ' on' : '') + '" x="' + lx + '" y="' + ly + '">' + label + '</text>' : '');
  }
  var arms = showBack ? 'triceps' : 'biceps';
  var s = '<svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">';
  s += '<circle class="inert" cx="100" cy="34" r="22"/><rect class="inert" x="90" y="54" width="20" height="14" rx="4"/>';
  s += '<rect class="inert" x="30" y="132" width="20" height="52" rx="10"/><rect class="inert" x="150" y="132" width="20" height="52" rx="10"/>';
  s += '<rect class="inert" x="68" y="300" width="28" height="80" rx="12"/><rect class="inert" x="104" y="300" width="28" height="80" rx="12"/>';
  s += r(arms, '<rect x="34" y="70" width="24" height="62" rx="12"/>', 46, 105, showBack ? 'TRI' : 'BI');
  s += r(arms, '<rect x="142" y="70" width="24" height="62" rx="12"/>', 154, 105, '');
  if (!showBack) {
    s += r('chest', '<rect x="62" y="66" width="76" height="54" rx="16"/>', 100, 97, 'CHEST');
    s += r('abs', '<rect x="72" y="124" width="56" height="64" rx="12"/>', 100, 160, 'ABS');
    s += '<rect class="inert" x="66" y="192" width="68" height="28" rx="12"/>';
    s += r('quads', '<rect x="64" y="216" width="34" height="82" rx="14"/>', 81, 260, 'QUAD');
    s += r('quads', '<rect x="102" y="216" width="34" height="82" rx="14"/>', 119, 260, 'QUAD');
  } else {
    s += r('back', '<rect x="62" y="66" width="76" height="122" rx="16"/>', 100, 130, 'BACK');
    s += r('glutes', '<rect x="64" y="192" width="72" height="40" rx="16"/>', 100, 216, 'GLUTES');
    s += r('hamstrings', '<rect x="64" y="236" width="34" height="62" rx="14"/>', 81, 270, 'HAM');
    s += r('hamstrings', '<rect x="102" y="236" width="34" height="62" rx="14"/>', 119, 270, 'HAM');
  }
  return s + '</svg>';
}

function homeView() {
  var sug = suggest();
  var n = S.workouts.length;
  var h = '<div class="topbar"><div><h1>What are we working today?</h1><p class="sub">Pick a muscle group</p></div>' +
    '<button class="iconbtn" data-act="go" data-v="settings" aria-label="Settings">⚙︎</button></div>';
  if (S.active) h += '<button class="btn primary block big" data-act="go" data-v="workout">Back to your workout</button>';
  h += '<div class="bodywrap">' + bodySVG(sug) +
    '<button class="btn sm flip" data-act="flip">↻ ' + (showBack ? 'Front' : 'Back') + '</button></div>';
  h += '<div class="row" style="justify-content:center;margin:6px 0 4px"><button class="btn" data-act="group" data-g="cardio">Cardio</button></div>';

  if (sug) {
    h += '<div class="card"><div class="label">Suggested today</div><div class="big">' + sug.groups.map(function (g) { return GN[g]; }).join(' + ') + '</div>' +
      '<div class="small muted" style="margin:6px 0 8px">' + sug.reasons.map(esc).join('<br>') + '</div>' +
      sug.exercises.map(function (e) { return '<span class="chip accent">' + esc(e.name) + '</span>'; }).join('') +
      '<button class="btn primary block" style="margin-top:12px" data-act="startsug">Start this workout</button></div>';
  } else {
    h += '<div class="card"><div class="label">Getting to know you</div><div><b>' + n + ' of ' + COLLECT + '</b> workouts logged. Suggestions start after ' + COLLECT + '.</div>' +
      '<div class="progress"><div style="width:' + Math.round(100 * n / COLLECT) + '%"></div></div></div>';
  }

  var dsc = daysSinceCardio();
  var last = sorted()[n - 1];
  h += '<div class="grid2">';
  h += '<div class="card' + (dsc !== null && dsc >= 2 ? ' warnbox' : '') + '"><div class="label">Days since cardio</div><div class="big">' + (dsc === null ? '–' : dsc) + '</div>' +
    '<div class="small muted">' + (dsc ? 'Carries into the next day' : dsc === 0 ? 'Done today' : 'No workouts yet') + '</div></div>';
  h += '<div class="card"><div class="label">Last workout</div>' + (last
    ? '<div style="font-weight:700">' + fmtDate(last.date) + '</div><div class="small muted">' + Object.keys(groupsOf(last)).map(function (g) { return GN[g]; }).join(', ') + '</div>'
    : '<div class="muted">None yet</div>') + '</div>';
  h += '</div>';

  var start = midnight(new Date()); start.setDate(start.getDate() - start.getDay());
  var thisWeek = 0, dots = '';
  for (var i = 0; i < 7; i++) {
    var d = new Date(start); d.setDate(start.getDate() + i);
    var did = S.workouts.some(function (w) { return daysBetween(w.date, d) === 0; });
    if (did) thisWeek++;
    var isToday = daysBetween(d, new Date()) === 0;
    dots += '<div class="day"><div class="dot' + (did ? ' on' : '') + (isToday ? ' today' : '') + '"></div>' + 'SMTWTFS'[i] + '</div>';
  }
  h += '<div class="card"><div class="row spread"><div class="label">This week</div><div class="small muted">' + plural(thisWeek, 'workout') + ' · ' + n + ' in total</div></div>' +
    '<div class="week">' + dots + '</div></div>';
  h += '<button class="btn block" data-act="go" data-v="history">History</button>';
  return h;
}

function entryCard(en, idx) {
  var e = ex(en.exerciseId), d = draftFor(en);
  var h = '<div class="card entry"><div class="row spread"><h3>' + esc(e.name) + '</h3>' +
    '<span class="small muted">' + CATS[e.category] + '</span></div>';
  h += '<div class="sets">' + (en.sets.length
    ? en.sets.map(function (s, i) { return '<span class="chip">' + (i + 1) + ': ' + fmtSet(e.kind, s) + '</span>'; }).join('') +
      ' <button class="btn sm" data-act="undo" data-i="' + idx + '">Undo</button>'
    : '<span class="small muted">' + (lastSetsFor(e.id) ? 'Pre-filled from last time' : 'First time logging this') + '</span>') + '</div>';
  function stp(field, label, inc, dec) {
    return '<div class="field"><div class="label">' + label + '</div><div class="stepper">' +
      '<button data-act="step" data-i="' + idx + '" data-f="' + field + '" data-d="-' + dec + '" aria-label="Less">−</button>' +
      '<input inputmode="decimal" data-act="edit" data-i="' + idx + '" data-f="' + field + '" value="' + d[field] + '">' +
      '<button data-act="step" data-i="' + idx + '" data-f="' + field + '" data-d="' + inc + '" aria-label="More">+</button></div></div>';
  }
  if (e.kind === 'timed') h += stp('seconds', 'Seconds', 15, 15);
  else if (e.kind === 'cardio') h += stp('minutes', 'Minutes', 1, 1) + stp('distance', 'Miles (optional)', 0.1, 0.1);
  else h += stp('reps', 'Reps', 1, 1) + stp('weight', 'Weight (' + S.unit + ')', step(), step());
  h += '<div class="row"><button class="btn primary big" style="flex:1" data-act="done" data-i="' + idx + '">' +
    (e.kind === 'cardio' ? 'Log cardio' : 'Done · set ' + (en.sets.length + 1)) + '</button>' +
    '<button class="btn" data-act="rmentry" data-i="' + idx + '">' + (armed === 'rm' + idx ? 'Remove?' : '✕') + '</button></div>';
  return h + '</div>';
}

function workoutView() {
  var w = S.active;
  var mins = Math.floor((Date.now() - new Date(w.date)) / 60000);
  var h = '<div class="topbar"><button class="iconbtn" data-act="go" data-v="home" aria-label="Home">‹</button>' +
    '<div style="flex:1"><h1 style="font-size:22px;margin:0">' + (w.groups.length ? w.groups.map(function (g) { return GN[g]; }).join(' + ') : 'Workout') + '</h1>' +
    '<div class="small muted" id="elapsed">' + mins + ' min</div></div></div>';
  if (!w.entries.length) h += '<div class="empty">Add your first exercise to start logging.</div>';
  w.entries.forEach(function (en, i) { h += entryCard(en, i); });
  h += '<button class="btn block big" data-act="go" data-v="pick">+ Add exercise</button>';
  h += '<div class="card"><div class="label">Extras</div><div class="row">' +
    '<button class="toggle' + (w.stretch ? ' on' : '') + '" data-act="tog" data-f="stretch">Stretched</button>' +
    '<button class="toggle' + (w.sauna ? ' on' : '') + '" data-act="tog" data-f="sauna">Sauna</button></div></div>';
  var any = w.entries.some(function (en) { return en.sets.length; }) || w.stretch || w.sauna;
  h += any ? '<button class="btn primary block big" data-act="finish">Finish workout</button>'
    : '<button class="btn danger block" data-act="discard">' + (armed === 'discard' ? 'Tap again to discard' : 'Discard workout') + '</button>';
  return h;
}

function pickView() {
  var w = S.active;
  var list = S.exercises.filter(function (e) {
    if (w.entries.some(function (en) { return en.exerciseId === e.id; })) return false;
    return pickTab === 'all' || e.groups.some(function (g) { return w.groups.indexOf(g) >= 0; });
  });
  list.sort(function (a, b) { return usage(b.id).n - usage(a.id).n || (a.name < b.name ? -1 : 1); });
  var h = '<div class="topbar"><button class="iconbtn" data-act="go" data-v="workout" aria-label="Back">‹</button><h1 style="flex:1;font-size:22px;margin:0">Add exercise</h1></div>';
  h += '<div class="tabs"><button class="' + (pickTab === 'today' ? 'on' : '') + '" data-act="tab" data-t="today">Today\'s groups</button>' +
    '<button class="' + (pickTab === 'all' ? 'on' : '') + '" data-act="tab" data-t="all">All</button></div>';
  Object.keys(CATS).forEach(function (c) {
    var items = list.filter(function (e) { return e.category === c; });
    if (!items.length) return;
    h += '<div class="label" style="margin-top:12px">' + CATS[c] + '</div><div class="card list" style="padding:0;margin-top:4px">' +
      items.map(function (e) {
        return '<button class="item" data-act="add" data-id="' + e.id + '"><span>' + esc(e.name) + '</span><span class="small muted">' +
          e.groups.map(function (g) { return GN[g]; }).join(', ') + '</span></button>';
      }).join('') + '</div>';
  });
  if (!list.length) h += '<div class="empty">Nothing here yet. Try All, or add your own below.</div>';
  h += '<div class="card"><h2>New exercise</h2><div class="field"><input type="text" id="nx-name" placeholder="Name, e.g. Cable fly"></div>' +
    '<div class="field"><select id="nx-cat">' + Object.keys(CATS).map(function (c) { return '<option value="' + c + '">' + CATS[c] + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><select id="nx-kind"><option value="strength">Reps and weight</option><option value="timed">Time (seconds)</option><option value="cardio">Minutes and distance</option></select></div>' +
    '<div class="row wrap">' + GROUPS.map(function (g) {
      return '<label class="check" style="width:46%"><input type="checkbox" class="nx-g" value="' + g[0] + '"' + (w.groups.indexOf(g[0]) >= 0 ? ' checked' : '') + '>' + g[1] + '</label>';
    }).join('') + '</div><button class="btn primary block" data-act="newex">Add and log it</button></div>';
  return h;
}

function historyView() {
  var ws = sorted().reverse();
  var h = '<div class="topbar"><button class="iconbtn" data-act="go" data-v="home" aria-label="Home">‹</button><h1 style="flex:1;font-size:22px;margin:0">History</h1></div>';
  if (!ws.length) h += '<div class="empty">No workouts yet.</div>';
  ws.forEach(function (w) {
    var mins = w.end ? Math.round((new Date(w.end) - new Date(w.date)) / 60000) : null;
    h += '<div class="card hist"><div class="row spread"><span class="when">' + fmtDate(w.date) + '</span><span class="small muted">' + (mins !== null ? mins + ' min' : '') + '</span></div>' +
      '<div style="margin:4px 0">' + Object.keys(groupsOf(w)).map(function (g) { return '<span class="chip accent">' + GN[g] + '</span>'; }).join('') +
      (w.stretch ? '<span class="chip">Stretched</span>' : '') + (w.sauna ? '<span class="chip">Sauna</span>' : '') + '</div>' +
      w.entries.map(function (en) {
        var e = ex(en.exerciseId) || { name: 'Deleted exercise', kind: 'strength' };
        return '<div class="small"><b>' + esc(e.name) + '</b> <span class="muted">' + en.sets.map(function (s) { return fmtSet(e.kind, s); }).join(', ') + '</span></div>';
      }).join('') +
      '<div style="text-align:right;margin-top:6px"><button class="btn sm danger" data-act="delw" data-id="' + w.id + '">' + (armed === 'del' + w.id ? 'Tap again to delete' : 'Delete') + '</button></div></div>';
  });
  return h;
}

function settingsView() {
  var h = '<div class="topbar"><button class="iconbtn" data-act="go" data-v="home" aria-label="Home">‹</button><h1 style="flex:1;font-size:22px;margin:0">Settings</h1></div>';
  h += '<div class="card"><h2>Weight unit</h2><div class="row"><button class="toggle' + (S.unit === 'lb' ? ' on' : '') + '" data-act="unit" data-u="lb">lb</button>' +
    '<button class="toggle' + (S.unit === 'kg' ? ' on' : '') + '" data-act="unit" data-u="kg">kg</button></div></div>';
  h += '<div class="card"><h2>Backup</h2><p class="small muted">Your workouts live only on this phone. Save a backup now and then, and restore it on a new phone.</p>' +
    '<div class="row"><button class="btn primary" style="flex:1" data-act="export">Save backup</button>' +
    '<label class="btn" style="flex:1">Restore<input type="file" accept="application/json,.json" id="import" hidden></label></div><p class="small" id="msg"></p></div>';
  h += '<div class="card"><h2>Add to Home Screen</h2><p class="small muted">In Safari, tap the Share button, then <b>Add to Home Screen</b>. WorkUp then opens full screen and works with no signal.</p></div>';
  h += '<button class="btn danger block" data-act="reset">' + (armed === 'reset' ? 'Tap again to erase everything' : 'Erase all data') + '</button>';
  return h;
}

function render() {
  if ((view === 'workout' || view === 'pick') && !S.active) view = 'home';
  app.innerHTML = ({ home: homeView, workout: workoutView, pick: pickView, history: historyView, settings: settingsView }[view])();
  if (view === 'workout') holdWake();
  renderRest();
}

// ---------- rest timer ----------
var restEl = document.getElementById('rest');
function renderRest() {
  var w = S.active;
  var left = w && w.restUntil ? Math.ceil((w.restUntil - Date.now()) / 1000) : 0;
  if (!w || view !== 'workout' || left <= 0) {
    if (w && w.restUntil && left <= 0) { w.restUntil = 0; save(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
    restEl.innerHTML = ''; return;
  }
  var t = Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2);
  restEl.innerHTML = '<div class="restbar"><div class="inner"><div><div class="label" style="margin:0">Rest</div><div class="time">' + t + '</div></div>' +
    '<button class="btn" data-act="rest" data-d="30">+30s</button><button class="btn" data-act="rest" data-d="0">Skip</button></div></div>';
}
setInterval(function () {
  renderRest();
  var el = document.getElementById('elapsed');
  if (el && S.active) el.textContent = Math.floor((Date.now() - new Date(S.active.date)) / 60000) + ' min';
}, 1000);

// ---------- events ----------
function num(v) { var x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : 0; }
function round(x) { return Math.round(x * 100) / 100; }

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]');
  if (!t || t.tagName === 'INPUT') return;
  var a = t.dataset.act, w = S.active, i = +t.dataset.i, en = w && w.entries[i];
  if (a !== armed && ['discard', 'reset', 'rmentry', 'delw'].indexOf(a) < 0) armed = null;
  switch (a) {
    case 'go': go(t.dataset.v); return;
    case 'flip': showBack = !showBack; break;
    case 'group': startWorkout([t.dataset.g]); return;
    case 'startsug': var s = suggest(); startWorkout(s.groups, s.exercises.map(function (e) { return e.id; })); return;
    case 'tab': pickTab = t.dataset.t; break;
    case 'add': addEntry(t.dataset.id); save(); go('workout'); return;
    case 'step':
      en.draft = draftFor(en);
      en.draft[t.dataset.f] = Math.max(0, round(num(en.draft[t.dataset.f]) + num(t.dataset.d)));
      save(); break;
    case 'done':
      var d = draftFor(en); en.sets.push(d); en.draft = null;
      if (ex(en.exerciseId).kind !== 'cardio') w.restUntil = Date.now() + 90000;
      save(); break;
    case 'undo': en.draft = en.sets.pop() || null; save(); break;
    case 'rmentry':
      if (armed === 'rm' + i) { w.entries.splice(i, 1); armed = null; save(); } else armed = 'rm' + i;
      break;
    case 'tog': w[t.dataset.f] = !w[t.dataset.f]; save(); break;
    case 'rest': w.restUntil = +t.dataset.d ? Math.max(Date.now(), w.restUntil) + 30000 : 0; save(); break;
    case 'finish': finishWorkout(); return;
    case 'discard':
      if (armed === 'discard') { S.active = null; save(); releaseWake(); go('home'); return; }
      armed = 'discard'; break;
    case 'newex':
      var name = document.getElementById('nx-name').value.trim();
      var gs = [].slice.call(document.querySelectorAll('.nx-g:checked')).map(function (c) { return c.value; });
      if (!name || !gs.length) { document.getElementById('nx-name').focus(); return; }
      var id = 'u' + uid();
      S.exercises.push({ id: id, name: name, category: document.getElementById('nx-cat').value, kind: document.getElementById('nx-kind').value, groups: gs });
      addEntry(id); save(); go('workout'); return;
    case 'delw':
      if (armed === 'del' + t.dataset.id) { S.workouts = S.workouts.filter(function (x) { return x.id !== t.dataset.id; }); armed = null; save(); }
      else armed = 'del' + t.dataset.id;
      break;
    case 'unit': S.unit = t.dataset.u; save(); break;
    case 'export': exportData(); return;
    case 'reset':
      if (armed === 'reset') { S = fresh(); save(); go('home'); return; }
      armed = 'reset'; break;
  }
  render();
});

document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.dataset && t.dataset.act === 'edit') {
    var en = S.active.entries[+t.dataset.i];
    en.draft = draftFor(en); en.draft[t.dataset.f] = Math.max(0, round(num(t.value))); save();
  }
  if (t.id === 'import' && t.files[0]) {
    var r = new FileReader();
    r.onload = function () {
      var msg = document.getElementById('msg');
      try {
        var d = JSON.parse(r.result);
        if (!d.exercises || !d.workouts) throw new Error();
        S = d; S.skips = S.skips || {}; save();
        msg.textContent = 'Restored ' + plural(S.workouts.length, 'workout') + '.';
      } catch (e) { msg.textContent = 'That file isn\'t a WorkUp backup.'; }
    };
    r.readAsText(t.files[0]);
  }
});

function exportData() {
  var name = 'workup-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  var msg = document.getElementById('msg');
  try {
    var file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'WorkUp backup' }).catch(function () {});
      return;
    }
  } catch (e) {}
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  if (msg) msg.textContent = 'Saved ' + name + '.';
}

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
}
})();
</script>
</body>
</html>
