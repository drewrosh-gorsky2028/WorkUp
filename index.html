<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>WorkUp</title>
<meta name="description" content="Log workouts on your phone and get suggestions for what to train next.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WorkUp">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Dreamy: lavender gradient, frosted glass cards, purple-to-lilac buttons. */
@font-face { font-family: 'Quicksand'; font-weight: 400 700; font-display: swap; src: url(quicksand.woff2) format('woff2'); }
:root {
  --paper: #f4f5f7; --ink: #14171f; --pen: #1f5eff; --lilac: #4fa3ff; --mute: #6b7280; --deep: #eceef2; --soft: rgba(20, 23, 31, .14);
  --glass: rgba(255, 255, 255, .62); --rim: rgba(255, 255, 255, .95); --glow: 0 10px 24px rgba(31, 94, 255, .28);
  --grad: linear-gradient(120deg, #1f5eff, #38b6ff);
  --hand: 'Quicksand', ui-rounded, -apple-system, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font: 500 16px/1.4 var(--hand);
  background: linear-gradient(170deg, #f6f7f9 0%, #ffffff 45%, #eceef2 100%) fixed;
  padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 32px);
  min-height: 100vh;
}
[hidden] { display: none !important; }
main { max-width: 480px; margin: 0 auto; padding: 18px max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h1 u { text-decoration: none; background: linear-gradient(transparent 62%, rgba(79, 163, 255, .45) 62% 92%, transparent 92%); }
.sub { margin: 4px 0 0; font-size: 16px; opacity: .85; }
.head { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.box { border: 1.6px solid var(--ink); border-radius: 4px 9px 5px 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pen { color: var(--pen); }
.muted { opacity: .75; }
.small { font-size: 13px; }
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.iconbtn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.6px solid var(--soft); background: transparent; font-size: 18px; display: grid; place-items: center; }
.back { align-self: flex-start; background: none; border: 0; padding: 4px 0; font-size: 15px; opacity: .8; }
.btn { border: 2px solid var(--pen); border-radius: 6px; padding: 10px; text-align: center; font-size: 20px; font-weight: 700;
  background: var(--pen); color: var(--paper); box-shadow: 3px 3px 0 var(--ink); width: 100%; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.ghost { font-weight: 700; color: var(--pen); background: transparent; border: 1.6px dashed var(--pen); border-radius: 6px; padding: 9px; width: 100%; }
.ghost:disabled { opacity: .35; }
.danger { background: transparent; border: 1.6px solid var(--soft); border-radius: 6px; padding: 9px; width: 100%; color: #d43d5c; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, .tile { font-weight: 600; font-size: 15px; background: transparent; border: 1.6px solid var(--ink); border-radius: 999px; padding: 5px 13px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile { border-radius: 4px 9px 5px 10px; padding: 10px 6px; }
.chip.on, .tile.on { background: var(--pen); border-color: var(--pen); color: var(--paper); }
.opt { align-self: flex-start; font-weight: 600; font-size: 13px; background: transparent; border: 1.4px dashed var(--ink); border-radius: 999px; padding: 4px 10px; opacity: .85; }
.opt.on { border-style: solid; border-color: var(--pen); background: var(--pen); color: var(--paper); opacity: 1; }
.toast { min-height: 1.2em; font-size: 14px; font-weight: 600; color: var(--pen); }

/* home */
.mid { position: relative; }
.fig { width: 100%; height: auto; display: block; overflow: visible; touch-action: manipulation; }
.fig .o { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.fig .tie { fill: var(--pen); }
.fig .cloud { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
.fig .rain, .fig .bolt { fill: none; stroke: var(--pen); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.fig .ld { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 3; opacity: .55; }
.fig .m path { fill: transparent; stroke: var(--ink); stroke-width: 1; stroke-opacity: .45; stroke-linejoin: round; cursor: pointer; }
.fig .m path.line { fill: none; pointer-events: none; }
.fig .m.on path { fill: url(#hatch); stroke: var(--pen); stroke-width: 1.6; stroke-opacity: 1; }
.fig .o.d { stroke-width: 1; opacity: .6; }
.fig .m.on path.line { fill: none; }
.fig .hatch line { stroke: var(--pen); stroke-width: 1.4; }
.fig text { font-family: var(--hand); font-size: 14px; font-weight: 600; fill: var(--ink); cursor: pointer; }
.fig text.on { fill: var(--pen); font-weight: 700; }
.cal { position: absolute; top: 6px; right: 0; width: 88px; border: 1.6px solid var(--ink); border-radius: 4px; padding: 14px 5px 6px; text-align: center; background: var(--paper); }
.cal.static { position: relative; top: auto; right: auto; width: auto; margin-top: 7px; padding: 14px 8px 8px; }
.cal.static .n { font-size: 36px; }
.cal.on { border-color: var(--pen); box-shadow: 3px 3px 0 var(--pen); }
.cal .head { justify-content: center; line-height: 1.15; font-size: 10px; }
.rings { position: absolute; top: -7px; left: 7px; right: 7px; display: flex; justify-content: space-between; }
.rings i { width: 7px; height: 13px; border: 1.6px solid var(--ink); border-radius: 6px; background: var(--paper); }
.cal .page { border: 1.6px solid var(--pen); border-radius: 3px; margin: 4px 2px; padding: 2px 0 1px; line-height: 1.1; }
.cal .n { font-size: 28px; line-height: 1; font-weight: 700; color: var(--pen); }
.cal .note { font-size: 9.5px; line-height: 1.2; opacity: .85; }
.picked { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1.6px dashed var(--ink); border-bottom: 1.6px dashed var(--ink); padding: 8px 2px; }
.picked > div { display: flex; flex-direction: column; min-width: 0; font-size: 15px; font-weight: 600; color: var(--pen); line-height: 1.25; }
.picked .head { color: var(--ink); }
.next { font-weight: 700; font-size: 16px; background: var(--pen); color: var(--paper); border: 0; border-radius: 6px; padding: 8px 14px; box-shadow: 3px 3px 0 var(--ink); flex: none; }
.wiggle { animation: wiggle .4s; }
@keyframes wiggle { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.date { font-size: 22px; font-weight: 700; color: var(--pen); line-height: 1.2; }
.days { display: flex; justify-content: space-between; text-align: center; font-size: 11px; }
.days span { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.days i { width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 50%; }
.days i.on { background: var(--pen); border-color: var(--pen); }
.days i.today { outline: 1.5px dashed var(--pen); outline-offset: 2px; }
.counts { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; gap: 4px; }
.counts div { display: flex; flex-direction: column; line-height: 1.05; }
.counts b { font-size: 24px; color: var(--pen); }
.counts small { font-size: 11px; }
.xlink { font-size: 12px; background: transparent; border: 1.4px dashed var(--soft); border-radius: 6px; padding: 6px 8px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.xlink .xl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--pen); }
.xlink .xv { opacity: .75; }
.xbar { height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.xbar i { display: block; height: 100%; background: var(--pen); }
.links { display: flex; justify-content: center; gap: 18px; font-size: 13px; }
.links button { background: none; border: 0; opacity: .7; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(79, 163, 255, .22);
  border-top: 1.6px solid var(--pen); border-bottom: 1.6px solid var(--pen); margin-inline: -18px; padding: 10px 24px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 50%, 100% 100%, 0 100%, 10px 50%); }
.banner > div { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.banner b { font-size: 13px; letter-spacing: .08em; color: var(--pen); }
.banner span { font-size: 13px; }
.banner button { font-weight: 700; font-size: 14px; background: transparent; color: var(--pen); border: 1.6px solid var(--pen); border-radius: 999px; padding: 5px 12px; flex: none; }
.banner.done button { background: var(--pen); color: var(--paper); }

/* home: Antigua countdown + journal spread */
.hero { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--pen); color: #fff; border: 0; border-radius: 6px 12px 8px 14px; padding: 14px 16px; box-shadow: 4px 4px 0 var(--ink); }
.hero .count { display: flex; flex-direction: row; justify-content: flex-start; align-items: baseline; gap: 10px; }
.hero .count b { color: #fff; font-size: 64px; line-height: .95; font-variant-numeric: tabular-nums; }
.hero .count span { font-size: 18px; font-weight: 700; }
.hero .boxes { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.hero .boxes i { aspect-ratio: 1; border: 1.2px solid rgba(255, 255, 255, .75); border-radius: 2px; }
.hero .boxes i.on { background: #fff; }
.spread { display: grid; grid-template-columns: 1fr 1fr; border: 1.6px solid var(--ink); border-radius: 4px 9px 5px 10px; }
.spread > * { padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.spread > * + * { border-left: 1.6px dashed var(--ink); }
.tear { background: transparent; border: 0; text-align: center; align-items: center; }
.tear .tn { font-size: 60px; line-height: 1; font-weight: 700; color: var(--pen); font-variant-numeric: tabular-nums; }
.lastw .lwd { font-weight: 700; font-size: 17px; color: var(--pen); }
.lastw ul { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.lastw li { display: flex; gap: 6px; }
.lastw li b { color: var(--pen); flex: none; font-size: 12px; }
.box.week { gap: 8px; }
.box.week .days i { width: 22px; height: 22px; }

/* why today */
.why { border: 1.6px dashed var(--pen); border-radius: 6px; padding: 10px 12px; font-size: 15px; line-height: 1.35; }
.why ul, .log ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.why li, .log li { display: flex; gap: 8px; }
.why li > span:first-child, .log li > span:first-child { color: var(--pen); font-weight: 700; flex: none; }

/* workout */
.step { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.num { font-style: normal; width: 18px; height: 18px; border: 1.5px solid var(--pen); color: var(--pen); border-radius: 50%; display: grid; place-items: center; font-size: 11px; flex: none; }
.name { font: 600 17px var(--hand); color: var(--ink); background: transparent; border: 0; border-bottom: 1.6px dashed var(--ink); padding: 6px 2px; border-radius: 0; width: 100%; }
.name::placeholder { color: var(--ink); opacity: .45; }
.name:focus { outline: none; border-bottom-color: var(--pen); }
.hint { font-size: 12px; opacity: .75; }
.stepper { display: flex; align-items: center; justify-content: space-between; border: 1.6px solid var(--ink); border-radius: 4px 9px 5px 10px; padding: 4px; gap: 4px; min-height: 48px; }
.stepper button { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1.6px solid var(--pen); background: transparent; color: var(--pen); font-size: 18px; font-weight: 700; }
.stepper label { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 2px; min-width: 0; font-size: 13px; }
.stepper input { width: 2.6em; min-width: 0; text-align: center; font: 700 22px var(--hand); color: var(--pen); background: transparent; border: 0; padding: 0; font-variant-numeric: tabular-nums; }
.stepper input:focus { outline: none; border-bottom: 1.5px dashed var(--pen); }
.stepper.flat { justify-content: center; font-weight: 700; color: var(--pen); }
.timer { padding-left: 12px; }
.timer b { font-size: 24px; color: var(--pen); font-variant-numeric: tabular-nums; }
.timer button { width: auto; border-radius: 999px; padding: 0 12px; font-size: 14px; }
.timer.run button { background: var(--pen); color: var(--paper); }
.tile.wide { grid-column: span 2; }
.ghint { min-height: 18px; display: flex; flex-direction: column; gap: 6px; }
.linkbtn { background: none; border: 0; padding: 2px 0; font-size: 12px; color: var(--pen); text-decoration: underline; text-underline-offset: 3px; }
.ssbox { border: 1.6px solid var(--pen); border-radius: 4px 9px 5px 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: rgba(79, 163, 255, .06); }
.ssbox .chip { font-size: 13px; padding: 4px 10px; }
.sshead { display: flex; align-items: center; justify-content: space-between; }
.exhead em.ss { color: var(--pen); font-weight: 700; opacity: 1; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.repeat small { display: block; font-weight: 500; font-size: 12px; color: var(--ink); opacity: .8; }
.log { border-top: 1.6px dashed var(--ink); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.log li { font-size: 15px; align-items: baseline; }
.log li em { font-style: normal; opacity: .7; font-size: 13px; }
.ex { display: flex; flex-direction: column; gap: 5px; padding: 6px 0; border-bottom: 1px dashed var(--soft); }
.ex:last-child { border-bottom: 0; }
.exhead { display: flex; align-items: baseline; gap: 6px; font-size: 15px; }
.exhead em { font-style: normal; opacity: .7; font-size: 12px; }
.setchips { display: flex; flex-wrap: wrap; gap: 6px; }
.setchip { font-weight: 600; font-size: 14px; background: transparent; color: var(--pen); border: 1.4px solid var(--pen); border-radius: 999px; padding: 3px 10px; font-variant-numeric: tabular-nums; }
.setchip:active { background: var(--pen); color: var(--paper); }
.exhead .rm, .log li .rm { margin-left: auto; flex: none; background: none; border: 0; color: var(--ink); opacity: .6; font-size: 13px; padding: 2px 4px; }

/* road to xmas */
.count { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.count div { display: flex; flex-direction: column; line-height: 1.05; }
.count b { font-size: 40px; color: var(--pen); font-variant-numeric: tabular-nums; }
.count small { font-size: 12px; letter-spacing: .06em; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.grid i { aspect-ratio: 1; border: 1.6px solid var(--ink); border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; }
.grid i.on { background: var(--pen); border-color: var(--pen); color: var(--paper); }
.grid i.goal { border-style: dashed; border-color: var(--pen); color: var(--pen); }
.grid i.goal.on { color: var(--paper); border-style: solid; }
.rewards { border: 1.6px dashed var(--pen); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.rewards ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.rewards li { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: baseline; }
.rewards li em { font-style: normal; font-size: 12px; opacity: .75; }
.rewards li.got { color: var(--pen); font-weight: 700; }

/* wrapped */
.story { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: flex; flex-direction: column; user-select: none; -webkit-user-select: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.bars { display: flex; gap: 4px; padding: 14px 16px 0; position: relative; z-index: 2; }
.bars i { flex: 1; height: 3px; border-radius: 2px; background: var(--soft); }
.bars i.done { background: var(--ink); }
.close { position: absolute; top: calc(env(safe-area-inset-top) + 24px); right: calc(env(safe-area-inset-right) + 12px); z-index: 3; background: none; border: 0; font-size: 26px; padding: 4px 10px; }
.card { flex: 1; padding: 40px 26px 40px; display: flex; flex-direction: column; justify-content: center; gap: 12px; max-width: 480px; width: 100%; margin: 0 auto; }
.story.purple { background: var(--pen); color: var(--paper); }
.story.deep { background: var(--deep); }
.story.purple .bars i { background: rgba(26, 26, 31, .25); }
.story.purple .bars i.done { background: var(--paper); }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.big { font-size: 88px; line-height: .9; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.card h2 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; text-wrap: balance; }
.card p { margin: 0; font-size: 17px; line-height: 1.35; }
.quip { font-size: 15px !important; opacity: .8; }
.rank { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rank li { display: grid; grid-template-columns: 28px 1fr auto; align-items: baseline; gap: 8px; font-size: 20px; font-weight: 600; }
.rank li span:first-child { font-size: 14px; opacity: .7; }
.rank li em { font-style: normal; font-size: 14px; opacity: .8; }
.rank li:first-child { font-size: 26px; color: var(--pen); }
.stamp { align-self: flex-start; border: 2px solid currentColor; border-radius: 6px; padding: 2px 10px; font-weight: 700; font-size: 14px; letter-spacing: .08em; transform: rotate(-4deg); }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.mini div { border: 1.6px solid currentColor; border-radius: 4px 9px 5px 10px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.mini b { font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
.mini span { font-size: 12px; }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
.pol { background: #f2f0ea; color: #1a1a1f; padding: 6px 6px 4px; border-radius: 2px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transform: rotate(-3deg); box-shadow: 0 4px 12px rgba(0, 0, 0, .35); }
.pol + .pol { transform: rotate(3deg); }
.pol .ph { aspect-ratio: 3 / 4; max-width: 100%; background: #2a2a31 center / cover no-repeat; color: #b9b9c4; display: grid; place-items: center; text-align: center; font-size: 12px; line-height: 1.3; }
.pol b { text-align: center; font-size: 13px; }
.taphint { text-align: center; font-size: 12px; opacity: .6; padding-bottom: 14px; }

/* stats */
.funlist { display: flex; flex-direction: column; gap: 12px; margin: 6px 0 0; padding: 0; list-style: none; }
.funlist li { display: flex; flex-direction: column; gap: 1px; padding-bottom: 12px; border-bottom: 1px solid var(--soft); }
.funlist li:last-child { border-bottom: 0; padding-bottom: 0; }
.funlist b { font-size: 20px; line-height: 1.2; }
.funlist span { font-size: 14px; color: var(--mute); }
.tiles4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sn { font-size: 30px; line-height: 1.1; font-weight: 700; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
.chartbox { gap: 8px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .base { stroke: var(--soft); stroke-width: 1; }
.chart .grid { stroke: var(--soft); stroke-width: 1; stroke-dasharray: 2 4; }
.chart .bar { fill: #9cc0ff; }
.chart .bar.hi { fill: var(--pen); }
.chart .val { font: 700 12px var(--hand); fill: var(--ink); }
.chart .tick { font: 600 10px var(--hand); fill: var(--mute); }
.chart .ln { fill: none; stroke: var(--pen); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: rgba(79, 163, 255, .18); }
.chart .dot { fill: var(--pen); stroke: #fff; stroke-width: 2; }
.chart .dot.hi { fill: #fff; stroke: var(--pen); stroke-width: 2.5; }
.hbars { display: flex; flex-direction: column; gap: 7px; }
.hrow { display: grid; grid-template-columns: 92px 1fr 52px; align-items: center; gap: 8px; font-size: 14px; }
.hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ht { height: 12px; border-radius: 6px; background: rgba(213, 216, 222, .35); overflow: hidden; }
.ht i { display: block; height: 100%; border-radius: 6px; background: var(--grad); }
.hv { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

/* history + settings */
.hist { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.hist .when { font-weight: 700; color: var(--pen); }
.empty { text-align: center; padding: 24px 8px; opacity: .7; }

function logSets(list) {

function burst(x, y) {
  if (!on('motion') || !x) return;
  for (var i = 0; i < 8; i++) {
    var a = i * Math.PI / 4 + Math.random() * .4, r = 34 + Math.random() * 22, el = document.createElement('span');
    el.className = 'burst'; el.textContent = '✦';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.setProperty('--x', Math.round(Math.cos(a) * r) + 'px'); el.style.setProperty('--y', Math.round(Math.sin(a) * r) + 'px');
    document.body.appendChild(el);
    setTimeout(function (e) { e.remove(); }.bind(null, el), 750);
  }
}

function chub() {   // 0 (fine) to 10 (two weeks off)
  // She fills out a bit each day you skip after two days off, and slims back down as you work out
  var days = {}, level = 0, ws = sorted();
  if (!ws.length) return 1;
  ws.forEach(function (w) { days[midnight(w.date).getTime()] = 1; });
  var d = midnight(ws[0].date), end = midnight(new Date()), off = 0;
  while (d <= end) {
    if (days[d.getTime()]) { level = Math.max(0, level - 2); off = 0; }
    else if (++off > 2) level = Math.min(10, level + 1);
    d.setDate(d.getDate() + 1);
  }
  return level;
}

  if (top.length) cards.push(['deep', '<span class="eyebrow">Your top muscle groups</span><ol class="rank">' + top.map(function (g, i) {
    return '<li><span>' + (i + 1) + '</span><span>' + GN[g] + '</span><em>' + gc[g] + '×</em></li>'; }).join('') + '</ol><p class="quip">' + GN[top[0]] + ', you\'re the main character.</p>']);
  var ec = {}; ws.forEach(function (w) { w.sets.forEach(function (s) { if (s.cat !== 'cardio') ec[s.name] = (ec[s.name] || 0) + 1; }); });
  var fav = Object.keys(ec).sort(function (a, b) { return ec[b] - ec[a]; })[0];
  if (fav) cards.push(['', '<span class="eyebrow">Your most repeated exercise</span><h2 class="pen">' + esc(fav) + '</h2><p><b>' + plural(ec[fav], 'set') + '</b> logged this month.</p>']);
  var first = {}, best = null;
  ws.forEach(function (w) { w.sets.forEach(function (s) {
    if (s.cat === 'cardio' || s.bw || !s.weight) return;
    if (first[s.name] == null) first[s.name] = s.weight;
    var up = s.weight - first[s.name];
    if (up > 0 && (!best || up > best.up)) best = { name: s.name, up: up, from: first[s.name], to: s.weight };
  }); });
  if (best) cards.push(['purple', '<span class="eyebrow">Biggest glow up</span><div class="big">+' + best.up + '</div><p>' + S.unit + ' on <b>' + esc(best.name) + '</b>, from ' + best.from + ' to ' + best.to + ' ' + S.unit + '.</p>']);
  var abs = ws.filter(didAbs).length;
  cards.push(['deep', '<span class="eyebrow">The one you hate</span><h2>Abs: ' + abs + ' out of ' + ws.length + ' workouts.</h2><p>' + (abs === ws.length ? 'You never skipped. You complained every time. We respect it.' : 'You skipped them ' + plural(ws.length - abs, 'time') + '. We noticed. They\'re always on for a reason.') + '</p>']);
  var cw = ws.filter(function (w) { return cardioMinutes(w) > 0; });
  var miles = round1(ws.reduce(function (t, w) { return t + w.sets.reduce(function (u, s) { return u + (s.cat === 'cardio' ? s.miles || 0 : 0); }, 0); }, 0));
  var mc = {}; ws.forEach(function (w) { w.sets.forEach(function (s) { if (s.cat === 'cardio') mc[s.name] = (mc[s.name] || 0) + 1; }); });
  var topM = Object.keys(mc).sort(function (a, b) { return mc[b] - mc[a]; })[0];
  cards.push(['', '<span class="eyebrow">Cardio, somehow</span><div class="big pen">' + cw.length + '</div><p>cardio ' + (cw.length === 1 ? 'session' : 'sessions') +
    (miles ? '. <b>' + miles + (miles === 1 ? ' mile' : ' miles') + '</b>' + (topM ? ', mostly ' + esc(topM === 'StairMaster' ? 'on the StairMaster' : topM.toLowerCase()) : '') + '.' : '.') + '</p><p class="quip">Road to Antigua: ' + roadCount() + ' of ' + ROAD.goal + ' boxes filled.</p>']);
  var dc = [0, 0, 0, 0, 0, 0, 0]; ws.forEach(function (w) { dc[new Date(w.date).getDay()]++; });
  var dow = dc.indexOf(Math.max.apply(null, dc));
  if (ws.length >= 3) cards.push(['', '<span class="eyebrow">Your gym personality</span><h2>You\'re a <span class="pen">' + DAYS[dow] + '</span> girl.</h2><p>Most of your workouts this month happened on ' + DAYS[dow] + 's.</p>']);
  cards.push(photoCard(month));
  cards.push(['purple', '<span class="eyebrow">' + name + ' ' + year + ' · WorkUp</span><div class="mini"><div><b>' + ws.length + '</b><span>workouts</span></div>' +
    '<div><b>' + (mins >= 60 ? Math.round(mins / 60) + ' h' : Math.round(mins) + ' min') + '</b><span>in the gym</span></div>' +
    '<div><b>' + (top[0] ? GN[top[0]] : 'Abs') + '</b><span>top group</span></div><div><b>' + miles + ' mi</b><span>cardio</span></div></div><p>Screenshot this one.</p>']);
  return cards;
}
function photoCard(month) {
  var p = S.photos[month] || {}, name = monthName(month).slice(0, 3);
  function pol(k, label) {
    return '<label class="pol" for="pic-' + k + '"><span class="ph"' + (p[k] ? ' style="background-image:url(' + p[k] + ')"' : '') + '>' + (p[k] ? '' : 'tap to take<br>a photo') + '</span><b>' + label + '</b></label>' +
      '<input type="file" id="pic-' + k + '" data-month="' + month + '" data-k="' + k + '" accept="image/*" capture="user" hidden>';
  }
  return ['deep', '<span class="eyebrow">Your progress pics</span><h2>Start of the month vs. now</h2><div class="pics">' + pol('start', name + ' 1') + pol('end', name + ' end') + '</div>' +
    '<p class="quip">Tap a polaroid to open your camera. Photos stay on this phone.</p>'];
}
function wrappedView() {
  var cards = photoOnly ? [photoCard(storyMonth)] : wrappedCards(storyMonth);
  storyIdx = Math.max(0, Math.min(cards.length - 1, storyIdx));
  var c = cards[storyIdx];
  return '<div class="story ' + c[0] + '" id="story"><div class="bars">' + cards.map(function (x, i) { return '<i class="' + (i <= storyIdx ? 'done' : '') + '"></i>'; }).join('') + '</div>' +
    '<button class="close" data-act="go" data-v="home" aria-label="Close">×</button>' +
    '<section class="card">' + c[1] + '</section><div class="taphint">' + (storyIdx < cards.length - 1 ? 'tap to continue' : 'tap × to close') + '</div></div>';
}

function render() {
  if (view === 'workout' && !S.active) view = 'home';
  app.innerHTML = ({ home: homeView, pick: pickView, why: whyView, workout: workoutView, road: roadView, history: historyView, stats: statsView, settings: settingsView, wrapped: wrappedView }[view])();
  if (view === 'workout') holdWake();
}

setInterval(function () {
  ['a', 'b'].forEach(function (k) {
    var el = document.getElementById('tval-' + k), sl = S.active && slot(k);
    if (el && sl && sl.tStart) el.textContent = mmss(timerSecs(sl));
  });
}, 500);

// ---------- events ----------
function setToast(m) { toastMsg = m; var t = document.getElementById('toast'); if (t) t.textContent = m; }

document.addEventListener('click', function (ev) {
  if (view === 'wrapped' && !ev.target.closest('[data-act], label, input')) {
    var st = document.getElementById('story');
    if (st) { storyIdx += ev.clientX < st.clientWidth / 3 ? -1 : 1; render(); }
    return;
  }
  var t = ev.target.closest('[data-act]');
  if (!t || t.tagName === 'INPUT') return;
  var a = t.dataset.act, w = S.active, u = w && w.ui;
  if (a !== armed && ['discard', 'reset', 'rmset', 'delw', 'finish'].indexOf(a) < 0) armed = null;
  switch (a) {
    case 'go': go(t.dataset.v); return;
    case 'pick':
      var g = t.dataset.g;
      if (g === 'abs') {
        var pl = document.getElementById('picklist'), ph = document.getElementById('pickhead');
        pl.classList.remove('wiggle'); void pl.offsetWidth; pl.classList.add('wiggle');
        ph.textContent = 'Abs stay on. You need them!';
        clearTimeout(ph._t); ph._t = setTimeout(function () { ph.textContent = 'Today'; }, 1600);
        return;
      }
      if (picks[g]) delete picks[g]; else { picks[g] = true; popPick = g; }
      break;
    case 'cardio': picks.cardio = true; go('pick'); return;
    case 'statex': statsEx = t.dataset.n; break;
    case 'stretch': stretched = !stretched; break;
    case 'start': startWorkout(); return;
    case 'wrapped':
      // Progress pic day opens just the photo card; otherwise last month's Wrapped
      photoOnly = !!t.dataset.photo; storyMonth = photoOnly ? ym(new Date().toISOString()) : wrapMonth(); storyIdx = 0;
      if (storyMonth) go('wrapped');
      return;
    case 'cat':
      var sl = slot(t.dataset.s);
      sl.cat = t.dataset.c; toastMsg = '';
      if (sl.cat === 'cardio') u.b = null;
      save(); break;
    case 'superset': u.b = u.b ? null : newSlot(u.cat); save(); break;
    case 'machine': u.machine = t.dataset.m; save(); break;
    case 'idea': sl = slot(t.dataset.s); sl.name = t.dataset.n; sl.g = null; sl.choose = false; prefill(t.dataset.s); save(); break;
    case 'choose': slot(t.dataset.s).choose = true; save(); break;
    case 'setg': sl = slot(t.dataset.s); sl.g = t.dataset.g; sl.choose = false; save(); break;
    case 'bw': sl = slot(t.dataset.s); sl.bw = !sl.bw; save(); break;
    case 'usetimer': sl = slot(t.dataset.s); sl.timer = !sl.timer; sl.tStart = 0; sl.secs = 0; save(); break;
    case 'timer':
      sl = slot(t.dataset.s);
      if (sl.tStart) { sl.secs = timerSecs(sl); sl.tStart = 0; } else { sl.secs = 0; sl.tStart = Date.now(); }
      save(); break;
    case 'step':
      sl = slot(t.dataset.s);
      sl[t.dataset.f] = Math.max(0, round1(num(sl[t.dataset.f]) + num(t.dataset.d))); save(); break;
    case 'log':
      if (u.cat === 'cardio') {
        if (!u.machine) { setToast('Pick a machine first (step 2).'); return; }
        if (!u.minutes) { setToast('Add your minutes first (step 3).'); return; }
        logSets([{ group: 'cardio', cat: 'cardio', name: u.machine, minutes: u.minutes, miles: u.miles || null }]);
        break;
      }
      if (!u.cat) { setToast('Pick what you\'re using first (step 1).'); return; }
      var list = [], ks = u.b ? ['a', 'b'] : ['a'];
      for (var q = 0; q < ks.length; q++) {
        var k = ks[q], x = slot(k), inp = document.getElementById('exname-' + k), second = k === 'b' ? 'second ' : '';
        if (inp) x.name = inp.value.trim();
        if (!x.cat) { setToast('Pick what you\'re using for the second exercise.'); return; }
        if (!x.name) { setToast('Type the ' + second + 'exercise name first.'); if (inp) inp.focus(); return; }
        if (!groupFor(x)) { x.choose = true; save(); render(); setToast('Tap which muscle the ' + second + 'exercise works.'); return; }
        if (x.timer && x.tStart) { x.secs = timerSecs(x); x.tStart = 0; }
        if (x.timer && !x.secs) { setToast('Start the timer, then stop it when you\'re done.'); return; }
        list.push({ group: groupFor(x), cat: x.cat, name: x.name, weight: x.bw ? null : x.weight, bw: x.bw, reps: x.timer ? null : x.reps, seconds: x.timer ? x.secs : null });
      }
      logSets(list);
      // A superset keeps its names for the next round; a single exercise starts fresh
      if (!u.b) { u.name = ''; u.g = null; u.choose = false; }
      u.secs = 0; if (u.b) u.b.secs = 0;
      save();
      break;
    case 'repeat': var lr = lastList(u); if (lr) logSets(JSON.parse(JSON.stringify(lr))); break;
    case 'again': logSets(t.dataset.i.split(',').map(function (i) { return JSON.parse(JSON.stringify(w.sets[+i])); })); break;
    case 'rmset':
      if (armed === 'rm' + t.dataset.i) {
        t.dataset.i.split(',').map(Number).sort(function (a, b) { return b - a; }).forEach(function (i) { w.sets.splice(i, 1); });
        armed = null; toastMsg = ''; save();
      } else armed = 'rm' + t.dataset.i;
      break;
    case 'doabs': armed = null; render(); window.scrollTo(0, 0); return;
    case 'finish':
      if (!didAbs(w) && armed !== 'finish') { armed = 'finish'; break; }
      finishWorkout(); return;
    case 'discard':
      if (armed === 'discard') { S.active = null; save(); releaseWake(); go('home'); return; }
      armed = 'discard'; break;
    case 'delw':
      if (armed === 'del' + t.dataset.id) { S.workouts = S.workouts.filter(function (x) { return x.id !== t.dataset.id; }); armed = null; save(); }
      else armed = 'del' + t.dataset.id;
      break;
    case 'unit': S.unit = t.dataset.u; save(); break;
    case 'export': exportData(); return;
    case 'reset':
      if (armed === 'reset') { S = fresh(); save(); go('home'); return; }
      armed = 'reset'; break;
  }
  var grew = popSet >= 0;
  render();
  popPick = null; popSet = -1;
  if (grew) burst(ev.clientX, ev.clientY);
});

function prefill(k) {
  // Same exercise as before? Start from what you did last time.
  var u = slot(k), s = u.name && lastSetNamed(u.name);
  if (!s || s.cat === 'cardio') return;
  u.bw = !!s.bw; if (s.weight) u.weight = s.weight;
  if (s.seconds != null) { u.timer = true; u.secs = 0; u.tStart = 0; } else { u.timer = false; if (s.reps) u.reps = s.reps; }
}

var tapping = false;
document.addEventListener('pointerdown', function () { tapping = true; }, true);
document.addEventListener('pointerup', function () { setTimeout(function () { tapping = false; }, 0); }, true);
document.addEventListener('pointercancel', function () { tapping = false; }, true);

document.addEventListener('input', function (ev) {
  var k = ev.target.dataset && ev.target.dataset.s;
  if (/^exname-/.test(ev.target.id) && S.active) {
    var sl = slot(k); sl.name = ev.target.value; sl.g = null; sl.choose = false; save();
    var hint = document.getElementById('ghint-' + k); if (hint) hint.innerHTML = groupHint(k);
  }
});

document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (/^exname-/.test(t.id) && S.active) {
    // Leaving the name by tapping a button: don't redraw under the tap, or the tap gets lost
    var sl = slot(t.dataset.s), before = JSON.stringify(sl); sl.name = t.value.trim();
    if (!tapping) prefill(t.dataset.s);
    save(); if (JSON.stringify(sl) !== before) render();
  }
  if (t.dataset && t.dataset.act === 'edit' && S.active) { slot(t.dataset.s)[t.dataset.f] = Math.max(0, round1(num(t.value))); save(); render(); }
  if (t.dataset && t.dataset.month && t.files && t.files[0]) savePhoto(t.dataset.month, t.dataset.k, t.files[0]);
  if (t.id === 'import' && t.files[0]) {
    var r = new FileReader();
    r.onload = function () {
      var msg = document.getElementById('msg');
      try {
        var d = JSON.parse(r.result);
        if (!d.workouts) throw new Error();
        S = migrate(d); S.photos = S.photos || {}; save();
        msg.textContent = 'Restored ' + plural(S.workouts.length, 'workout') + '.';
      } catch (e) { msg.textContent = 'That file isn\'t a WorkUp backup.'; }
    };
    r.readAsText(t.files[0]);
  }
});

function savePhoto(month, k, file) {
  // Shrink the photo so it fits in the phone's storage for this app
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function () {
    var max = 720, sc = Math.min(1, max / Math.max(img.width, img.height));
    var c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    S.photos[month] = S.photos[month] || {};
    S.photos[month][k] = c.toDataURL('image/jpeg', 0.75);
    if (!save()) { delete S.photos[month][k]; alert('Your phone is out of space for WorkUp photos. Save a backup, then try again.'); }
    render();
  };
  img.src = url;
}

function exportData() {
  var name = 'workup-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  var blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  var msg = document.getElementById('msg');
  try {
    var file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'WorkUp backup' }).catch(function () {});
      return;
    }
  } catch (e) {}
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  if (msg) msg.textContent = 'Saved ' + name + '.';
}

// The first time you open the app on the 1st to the 3rd, last month's Wrapped pops up
if (wrapMonth() && S.wrapSeen !== wrapMonth() && !S.active) { storyMonth = S.wrapSeen = wrapMonth(); photoOnly = false; view = 'wrapped'; save(); }
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
}
})();
</script>
